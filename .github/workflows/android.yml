name: Android
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "README.md"
      - "docs/android-quickstart.md"
      - "docs/ROADMAP.md"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "README.md"
      - "docs/android-quickstart.md"
      - "docs/ROADMAP.md"
      - ".github/workflows/android.yml"
  workflow_dispatch:
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK, NDK, and CMake
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android debug APK and run unit tests
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon :android:testDebugUnitTest :android:assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr-siavash-el-agent-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
