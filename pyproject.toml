[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "mr-siavash-el-agent"
version = "0.2.0"
description = "Local-first personal device companion for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mss>=9,<11", "Pillow>=10,<13"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
voice = ["sounddevice>=0.4.6,<1", "vosk>=0.3.45,<1", "pyttsx3>=2.90,<3"]
cloud = ["keyring>=25,<26"]
[project.scripts]
el-agent = "el_agent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
